<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Emotion Controller</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      gap: 20px;
    }

    #toggle {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    #container {
      display: flex;
      gap: 20px;
    }

    .column {
      border: 1px solid #ddd;
      padding: 12px;
      border-radius: 8px;
      width: 200px;
      text-align: center;
      background: white;
      transition: background 0.2s, opacity 0.2s, border-color 0.2s;
    }

    .column.inactive {
      background: #cfcfcf;
      border-color: #999;
      opacity: 0.75;
    }

    .column h2 {
      margin: 0 0 10px 0;
      cursor: pointer;
    }

    .column.inactive h2 {
      color: #555;
    }

    button {
      width: 100%;
      margin: 6px 0;
      padding: 10px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #f0f0f0;
      transition: background 0.2s, color 0.2s, opacity 0.2s, border-color 0.2s;
    }

    .column.inactive button {
      background: #b8b8b8;
      border-color: #8f8f8f;
      color: #555;
    }

    button.active {
      background: #4caf50;
      color: white;
      border-color: #3e8e41;
    }

    .modeBtn {
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid #ccc;
      background: #f0f0f0;
    }

    .modeBtn.active {
      background: #4caf50;
      color: white;
      border-color: #3e8e41;
    }

    .speakerBtn {
      margin-bottom: 10px;
      font-weight: bold;
    }

    .speakerBtn.active {
      background: #2196f3;
      color: white;
      border-color: #1976d2;
    }
  </style>
</head>
<body>

  <div id="toggle">
    <button class="modeBtn active" id="tabletBtn">Tablet</button>
    <button class="modeBtn" id="phoneBtn">Phone</button>
  </div>

  <div id="container"></div>

<script>
  const phones = ["phone_1", "phone_2", "phone_3", "phone_4"];
  const emotions = ["Frustrated😤", "Excited🥳", "impressed😲", "Regretful😔", "Confused🤔", "Concerned😬", "Relieved😅", "Tired😴", "neutral"];
  const pollingTime = 200;

  const container = document.getElementById("container");
  const titles = {};
  const speakerButtons = {};
  const columns = {};
  let mode = "tablet";

  document.getElementById("tabletBtn").onclick = () => setMode("tablet");
  document.getElementById("phoneBtn").onclick = () => setMode("phone");

  function setMode(newMode) {
    mode = newMode;
    document.getElementById("tabletBtn").classList.toggle("active", mode === "tablet");
    document.getElementById("phoneBtn").classList.toggle("active", mode === "phone");
  }

  phones.forEach(phoneId => {
    const column = document.createElement("div");
    column.className = "column";
    column.id = phoneId;
    columns[phoneId] = column;

    const speakerBtn = document.createElement("button");
    speakerBtn.className = "speakerBtn";
    speakerBtn.id = `speaker_${phoneId}`;
    speakerBtn.innerText = "Not speaker";
    speakerBtn.onclick = () => setSpeaker(phoneId);

    speakerButtons[phoneId] = speakerBtn;
    column.appendChild(speakerBtn);

    const title = document.createElement("h2");
    title.innerText = phoneId.toUpperCase();
    title.onclick = () => editNickname(phoneId);

    titles[phoneId] = title;
    column.appendChild(title);

    emotions.forEach(emotion => {
      const btn = document.createElement("button");
      btn.id = `${phoneId}_${emotion}`;
      btn.innerText = emotion.charAt(0).toUpperCase() + emotion.slice(1);
      btn.onclick = () => setEmotion(phoneId, emotion);
      column.appendChild(btn);
    });

    container.appendChild(column);
  });

  async function setEmotion(id, emotion) {
    if (mode === "tablet") {
      await fetch("/reset", { method: "POST" });
    }

    await fetch("/emotion", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, emotion })
    });

    updateHighlight(id, emotion);
  }

  async function setSpeaker(id) {
    await fetch(`/speaker/${id}`, {
      method: "POST"
    });

    pollState();
  }

  async function editNickname(id) {
    const newNickname = prompt("Enter new nickname:");
    if (!newNickname) return;

    const res = await fetch(`/emotion/${id}`);
    const current = await res.json();

    await fetch("/emotion", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        id,
        emotion: current.emotion,
        nickname: newNickname
      })
    });
  }

  async function pollState() {
    const res = await fetch("/state");
    const state = await res.json();

    phones.forEach(id => {
      const device = state[id];
      const isActive = !!device;

      const emotion = device?.emotion || "neutral";
      const nickname = device?.nickname || id;
      const isSpeaker = device?.speaker || false;

      titles[id].innerText = nickname;
      updateHighlight(id, emotion);
      updateSpeakerButton(id, isSpeaker);
      updateCardActive(id, isActive);
    });
  }

  function updateHighlight(id, emotion) {
    emotions.forEach(e => {
      const btn = document.getElementById(`${id}_${e}`);
      if (btn) btn.classList.toggle("active", e === emotion);
    });
  }

  function updateSpeakerButton(id, isSpeaker) {
    const btn = speakerButtons[id];
    if (!btn) return;

    btn.classList.toggle("active", isSpeaker);
    btn.innerText = isSpeaker ? "Speaker" : "Not speaker";
  }

  function updateCardActive(id, isActive) {
    const column = columns[id];
    if (!column) return;

    column.classList.toggle("inactive", !isActive);
  }

  setInterval(pollState, pollingTime);
  pollState();
</script>

</body>
</html>
